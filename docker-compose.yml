services:
  postgres:
    image: postgres:16
    container_name: mytitan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mytitan
      POSTGRES_USER: mytitan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7
    container_name: mytitan_redis
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: mytitan_api
    container_name: mytitan_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mytitan:${POSTGRES_PASSWORD}@postgres:5432/mytitan
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      APP_PUBLIC_URL: https://app.mytitan.co.uk
      API_PUBLIC_URL: https://api.mytitan.co.uk
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_RATE_LIMIT_MAX_REQUESTS: ${AI_RATE_LIMIT_MAX_REQUESTS:-20}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-60}
      TENANT_LOGO_MAX_BYTES: ${TENANT_LOGO_MAX_BYTES:-2097152}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_SOLE_TRADER_MONTHLY: ${STRIPE_PRICE_SOLE_TRADER_MONTHLY}
      STRIPE_PRICE_SOLE_TRADER_ANNUAL: ${STRIPE_PRICE_SOLE_TRADER_ANNUAL}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY}
      STRIPE_PRICE_BUSINESS_ANNUAL: ${STRIPE_PRICE_BUSINESS_ANNUAL}
      STRIPE_PRICE_ENTERPRISE_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_MONTHLY}
      STRIPE_PRICE_ENTERPRISE_ANNUAL: ${STRIPE_PRICE_ENTERPRISE_ANNUAL}
      STRIPE_BILLING_RETURN_URL: ${STRIPE_BILLING_RETURN_URL:-https://app.mytitan.co.uk/dashboard/billing}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      MYTITAN_BILLING_MODE: ${MYTITAN_BILLING_MODE:-enforce}
      MYTITAN_BILLING_ALLOWLIST_EMAILS: ${MYTITAN_BILLING_ALLOWLIST_EMAILS:-}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-0}
      MYTITAN_FEATURE_MARKETPLACE: ${MYTITAN_FEATURE_MARKETPLACE:-off}
      MYTITAN_FEATURE_TRADE_PACKS: ${MYTITAN_FEATURE_TRADE_PACKS:-off}
      MYTITAN_FEATURE_START_HERE: ${MYTITAN_FEATURE_START_HERE:-off}
      MYTITAN_FEATURE_WHEELS_FORM_V1: ${MYTITAN_FEATURE_WHEELS_FORM_V1:-off}
      MYTITAN_FEATURE_PUBLIC_DEMO: ${MYTITAN_FEATURE_PUBLIC_DEMO:-off}
      MYTITAN_FEATURE_COMMAND_CENTRE: ${MYTITAN_FEATURE_COMMAND_CENTRE:-on}
      MYTITAN_FEATURE_CRM_V1: ${MYTITAN_FEATURE_CRM_V1:-on}
      MYTITAN_FEATURE_DRAFTS_V1: ${MYTITAN_FEATURE_DRAFTS_V1:-on}
      MYTITAN_FEATURE_DEMO_TOUR_V1: ${MYTITAN_FEATURE_DEMO_TOUR_V1:-off}
      MYTITAN_FEATURE_AUTH_POLISH_V1: ${MYTITAN_FEATURE_AUTH_POLISH_V1:-off}
      MYTITAN_FEATURE_MARKETING_POLISH_V1: ${MYTITAN_FEATURE_MARKETING_POLISH_V1:-off}
      MYTITAN_FEATURE_COMMAND_CENTRE_V1: ${MYTITAN_FEATURE_COMMAND_CENTRE_V1:-off}
      MYTITAN_FEATURE_LOCATIONS_V1: ${MYTITAN_FEATURE_LOCATIONS_V1:-off}
      MYTITAN_FEATURE_INVENTORY_V1: ${MYTITAN_FEATURE_INVENTORY_V1:-off}
      MYTITAN_FEATURE_LOGOUT_V1: ${MYTITAN_FEATURE_LOGOUT_V1:-off}
      MYTITAN_FEATURE_COMMAND_CENTRE_PREMIUM_V1: ${MYTITAN_FEATURE_COMMAND_CENTRE_PREMIUM_V1:-off}
      MYTITAN_FEATURE_GUIDED_EVERYWHERE_V1: ${MYTITAN_FEATURE_GUIDED_EVERYWHERE_V1:-off}
      MYTITAN_FEATURE_AUTH_SECURITY_V1: ${MYTITAN_FEATURE_AUTH_SECURITY_V1:-off}
      MYTITAN_FEATURE_LOCATIONS_ADVANCED_V1: ${MYTITAN_FEATURE_LOCATIONS_ADVANCED_V1:-off}
      MYTITAN_FEATURE_INVENTORY_PRO_V1: ${MYTITAN_FEATURE_INVENTORY_PRO_V1:-off}
      MYTITAN_FEATURE_COMMAND_CENTRE_V2: ${MYTITAN_FEATURE_COMMAND_CENTRE_V2:-off}
      MYTITAN_FEATURE_BOOKING_PRO_V1: ${MYTITAN_FEATURE_BOOKING_PRO_V1:-off}
      MYTITAN_FEATURE_CRM_PRO_V1: ${MYTITAN_FEATURE_CRM_PRO_V1:-off}
      MYTITAN_FEATURE_DEMO_POLISH_V1: ${MYTITAN_FEATURE_DEMO_POLISH_V1:-off}
      MYTITAN_FEATURE_MEDIA_SIGNATURE_V1: ${MYTITAN_FEATURE_MEDIA_SIGNATURE_V1:-off}
      MYTITAN_FEATURE_NOTIFICATIONS_V1: ${MYTITAN_FEATURE_NOTIFICATIONS_V1:-off}
      MYTITAN_FEATURE_CALENDAR_V2_DRAG: ${MYTITAN_FEATURE_CALENDAR_V2_DRAG:-off}
      MYTITAN_FEATURE_CALENDAR_V1: ${MYTITAN_FEATURE_CALENDAR_V1:-off}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - postgres
      - redis
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - internal

