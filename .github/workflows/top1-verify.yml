name: top1-verify

on:
  push:
    branches: [ "master", "top1-broader-pass" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: "ci_password"
      JWT_SECRET: "ci_jwt_secret"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001"
      OPENAI_API_KEY: "ci_dummy"
      STRIPE_SECRET_KEY: "ci_dummy"
      STRIPE_WEBHOOK_SECRET: "ci_dummy"
      STRIPE_PRICE_SOLE_TRADER_MONTHLY: "ci_dummy"
      STRIPE_PRICE_SOLE_TRADER_ANNUAL: "ci_dummy"
      STRIPE_PRICE_BUSINESS_MONTHLY: "ci_dummy"
      STRIPE_PRICE_BUSINESS_ANNUAL: "ci_dummy"
      STRIPE_PRICE_ENTERPRISE_MONTHLY: "ci_dummy"
      STRIPE_PRICE_ENTERPRISE_ANNUAL: "ci_dummy"

    steps:
      - uses: actions/checkout@v4

      - name: Bring up stack
        run: |
          docker compose up -d postgres redis api
          docker ps

      - name: Migrate + generate + scheduling smoke suite
        run: |
          docker exec -w /app mytitan_api /bin/sh -lc "
            set -euo pipefail
            npx prisma migrate deploy
            npx prisma generate
            npm run test:scheduling
          "

      - name: Build api image
        run: |
          docker compose build api

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
