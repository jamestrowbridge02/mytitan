# Include in both the api.mytitan.co.uk and app.mytitan.co.uk TLS server blocks.
# The API applies lower per-file-type limits; this ceiling allows multipart overhead.
client_max_body_size 110M;

# Use this location in the API server when uploads are sent directly to api.mytitan.co.uk.
location ^~ /artifacts/ {
    client_max_body_size 110M;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
